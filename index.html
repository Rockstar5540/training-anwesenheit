<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.json">
<title>Training</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;background:#f1f5f1;color:#111}
header{background:#2e7d32;color:#fff;padding:12px;position:sticky;top:0;z-index:2}
header h1{font-size:18px;margin:0 0 8px}
.nav{display:flex;justify-content:space-between;align-items:center}
.nav button{background:#fff3;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:18px}
.nav span{font-size:15px}
main{padding:10px;max-width:600px;margin:auto}
.add{display:flex;gap:6px;margin-bottom:10px}
.add input{flex:1;padding:12px;font-size:16px;border:1px solid #bbb;border-radius:8px}
.add button{padding:12px 16px;font-size:16px;border:0;border-radius:8px;background:#2e7d32;color:#fff}
.day{background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 1px 3px #0002;overflow:hidden}
.day.today{outline:3px solid #2e7d32}
.dh{display:flex;justify-content:space-between;padding:10px 12px;background:#e3efe3;font-weight:600}
label.p{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid #eee;font-size:17px}
label.p input{width:24px;height:24px}
label.p.on{background:#e8f5e9}
.x{margin-left:auto;color:#c62828;background:none;border:0;font-size:20px}
.empty{padding:12px;color:#777}
.mng{text-align:center;margin:14px 0}
.mng button{background:none;border:1px solid #999;border-radius:8px;padding:8px 12px}
</style>
</head>
<body>
<header>
<h1>Training Anwesenheit</h1>
<div class="nav"><button id="prev">&lt;</button><span id="wk"></span><button id="next">&gt;</button></div>
</header>
<main>
<form class="add" id="f"><input id="n" placeholder="Neuer Name" autocomplete="off"><button>+</button></form>
<div id="days"></div>
<div class="mng"><button id="edit">Personen löschen ein/aus</button></div>
</main>
<script>
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
let S=JSON.parse(localStorage.getItem('training')||'{"people":[],"att":{}}');
let off=0,edit=false;
const save=()=>localStorage.setItem('training',JSON.stringify(S));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function monday(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d}
function render(){
 const m=monday(),root=document.getElementById('days');root.innerHTML='';
 const e=new Date(m);e.setDate(e.getDate()+6);
 document.getElementById('wk').textContent=m.getDate()+'.'+(m.getMonth()+1)+'. – '+e.getDate()+'.'+(e.getMonth()+1)+'.'+e.getFullYear();
 const today=fmt(new Date());
 for(let i=0;i<7;i++){
  const d=new Date(m);d.setDate(m.getDate()+i);const k=fmt(d);
  const list=S.att[k]||[];
  const box=document.createElement('div');box.className='day'+(k===today?' today':'');
  const h=document.createElement('div');h.className='dh';
  const t=document.createElement('span');t.textContent=DAYS[i]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.';
  const c=document.createElement('span');c.textContent=list.filter(n=>S.people.includes(n)).length+' / '+S.people.length;
  h.append(t,c);box.append(h);
  if(!S.people.length){const p=document.createElement('div');p.className='empty';p.textContent='Noch keine Personen. Oben Namen hinzufügen.';box.append(p)}
  S.people.forEach(name=>{
   const l=document.createElement('label');const on=list.includes(name);l.className='p'+(on?' on':'');
   const cb=document.createElement('input');cb.type='checkbox';cb.checked=on;
   cb.onchange=()=>{const a=S.att[k]||[];S.att[k]=cb.checked?[...a,name]:a.filter(x=>x!==name);save();render()};
   const s=document.createElement('span');s.textContent=name;
   l.append(cb,s);
   if(edit){const x=document.createElement('button');x.type='button';x.className='x';x.textContent='✕';
    x.onclick=ev=>{ev.preventDefault();if(confirm(name+' löschen?')){S.people=S.people.filter(p=>p!==name);save();render()}};l.append(x)}
   box.append(l)});
  root.append(box)}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const i=document.getElementById('n'),v=i.value.trim();
 if(v&&!S.people.includes(v)){S.people.push(v);save()}i.value='';render()};
document.getElementById('prev').onclick=()=>{off--;render()};
document.getElementById('next').onclick=()=>{off++;render()};
document.getElementById('edit').onclick=()=>{edit=!edit;render()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script>
</body>
</html>
